{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<!-- 🔙 BACK BUTTON -->
<a href="/staff/dashboard/" class="btn btn-secondary mb-3">
← Back
</a>

<h3>All Materials</h3>

<hr>

<div class="row">

{% for material in materials %}

<div class="col-md-3 mb-4">
<div class="card p-3 text-center">

<h6>{{ material.title }}</h6>

<p class="text-muted">
{{ material.subject.name }} <br>
<small>{{ material.section }}</small>
</p>

<!-- VIEW -->
<a href="{{ material.file.url }}" target="_blank"
class="btn btn-primary btn-sm mt-2">
View
</a>

<!-- DELETE -->
<a href="/staff/delete/{{ material.id }}/"
class="btn btn-danger btn-sm mt-2">
Delete
</a>

</div>
</div>

{% empty %}

<p>No materials available</p>

{% endfor %}

</div>

</div>

{% endblock %}
