{% extends "base.html" %}

{% block content %}





<div class="container mt-5">

<button onclick="history.back()" class="btn btn-outline-secondary mb-3">
← Back
</button>

<h2>Semester {{ semester }} Subjects</h2>

<div class="row mt-4">

{% for subject in subjects %}

<div class="col-md-4 mb-3">

<div class="card shadow">

<div class="card-body text-center">

<h5>{{ subject.name }}</h5>

<a href="/materials/subject/{{ subject.id }}/" class="btn btn-primary btn-sm mt-2">
View Materials
</a>

</div>

</div>

</div>

{% empty %}

<div class="col-12">
<div class="alert alert-warning text-center">
No subjects available for this scheme.
</div>
</div>

{% endfor %}

</div>

</div>

{% endblock %}
