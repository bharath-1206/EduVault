{% extends "base.html" %}

{% block content %}

<h4 class="mb-4">

Welcome {{ student.name }}

</h4>

<h5>Available Semesters</h5>

<div class="row mt-3">

{% for i in "12345678" %}

<div class="col-md-3 mb-3">

<div class="card text-center shadow border-primary">

<div class="card-body">

<h5>Semester {{ i }}</h5>

<a href="/materials/semester/{{ i }}/{{ student.branche.id }}/"
   class="btn btn-primary btn-sm">

View Subjects

</a>

</div>

</div>

</div>

{% endfor %}

</div>

{% endblock %}
