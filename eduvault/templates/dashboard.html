{% extends "base.html" %}

{% block content %}




<div class="col-md-10 p-4">
<button onclick="history.back()" class="btn btn-outline-secondary mb-3">
← Back
</button>
<h3>Welcome {{ student.name }}</h3>

<p class="text-muted">
Branch: {{ student.branche }}
</p>

<hr>

<h4>Available Semesters</h4>

<div class="row mt-4">

{% for i in "12345678" %}

<div class="col-md-3 mb-4">

<div class="card dashboard-card p-4 text-center">

<h5>Semester {{ i }}</h5>

<a href="/materials/semester/{{ i }}/{{ student.branche.id }}/"
class="btn btn-primary btn-sm mt-3">

View Materials

</a>

</div>

</div>

{% endfor %}

</div>

</div>

{% endblock %}
