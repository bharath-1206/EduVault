<!DOCTYPE html>
<html>
<head>

<title>Staff Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">
<a href="/logout/" class="btn btn-danger mb-3">
Logout
</a>

<div class="container mt-5">

<div class="card shadow p-4">

<h3>Upload Study Material</h3>
    <hr>

<h4>Uploaded Materials</h4>

<table class="table table-bordered mt-3">

<thead>
<tr>
<th>Title</th>
<th>Subject</th>
<th>Semester</th>
<th>Action</th>
</tr>
</thead>

<tbody>

{% for m in materials %}

<tr>

<td>{{ m.title }}</td>

<td>{{ m.subject.name }}</td>

<td>Semester {{ m.semester.number }}</td>

<td>

<a href="{{ m.file.url }}" class="btn btn-success btn-sm">
View
</a>

<a href="/staff/delete/{{ m.id }}/" class="btn btn-danger btn-sm">
Delete
</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

<form action="/staff/upload/" method="POST" enctype="multipart/form-data">

{% csrf_token %}

<input type="text"
       name="title"
       class="form-control mb-3"
       placeholder="Material Title"
       required>



<select name="semester" id="semester-dropdown" class="form-control mb-3">

{% for s in semesters %}
<option value="{{ s.id }}">Semester {{ s.number }}</option>
{% endfor %}

</select>

<select name="subject" id="subject-dropdown" class="form-control mb-3">

{% for sub in subjects %}
<option value="{{ sub.id }}">{{ sub.name }}</option>
{% endfor %}

</select>

<input type="file"
       name="file"
       class="form-control mb-3"
       required>

<button class="btn btn-primary">
Upload Material
</button>

</form>

</div>

</div>

<!-- ADD SCRIPT HERE -->

<script>

document.getElementById("semester-dropdown").addEventListener("change", function(){

    var semesterId = this.value
    var branchId = "{{ staff.branch.id }}"

    fetch(`/staff/get-subjects/?semester=${semesterId}&branch=${branchId}`)

    .then(response => response.json())

    .then(data => {

        var subjectDropdown = document.getElementById("subject-dropdown")

        subjectDropdown.innerHTML = ""

        data.forEach(function(subject){

            var option = document.createElement("option")

            option.value = subject.id
            option.text = subject.name

            subjectDropdown.appendChild(option)

        })

    })

})

</script>

</body>
</html>
