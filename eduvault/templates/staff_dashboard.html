{% extends "base.html" %}

{% block content %}

<div class="col-md-10 p-4">

<h3>Welcome {{ staff.name }}</h3>

<!-- ✅ FIXED ROLE DISPLAY -->
{% if staff.role_type == "cycle" %}
<p class="text-muted">
Role: Cycle Staff
</p>
{% else %}
<p class="text-muted">
Branch: {{ staff.branch }}
</p>
{% endif %}

<hr>

<h4>Upload Study Material</h4>

<div class="card dashboard-card p-4 mb-4">

<form method="POST" enctype="multipart/form-data" action="/staff/upload/">

{% csrf_token %}

<div class="mb-3">

<label>Scheme</label>

<select name="scheme" id="scheme" class="form-control" required>

<option value="">Select Scheme</option>

{% for scheme in schemes %}
<option value="{{ scheme.id }}">{{ scheme.year }}</option>
{% endfor %}

</select>

</div>


<div class="mb-3">

<label>Subject</label>

<select name="subject" id="subject" class="form-control" required>

<option value="">Select Subject</option>

</select>

</div>


<div class="mb-3">

<label>Section</label>

<select name="section" class="form-control" required>

<option value="">Select Section</option>

{% for section in sections %}
<option value="{{ section.id }}">
{{ section }}
</option>
{% endfor %}

</select>

</div>


<div class="mb-3">

<label>Material Title</label>

<input type="text" name="title" class="form-control" required>

</div>


<div class="mb-3">

<label>Upload File</label>

<input type="file" name="file" class="form-control" required>

</div>


<button class="btn btn-success">
Upload Material
</button>

</form>

</div>
<a href="/staff/materials/" class="btn btn-primary mb-3">
    View All Materials
</a>

<hr>


</div>


<script>

document.getElementById("scheme").addEventListener("change", function(){

const schemeId = this.value;

let subjectSelect = document.getElementById("subject");
let sectionSelect = document.querySelector("select[name='section']");

// RESET
subjectSelect.innerHTML = '<option value="">Select Subject</option>';
sectionSelect.innerHTML = '<option value="">Select Section</option>';

if(!schemeId) return;

// -------------------
// LOAD SUBJECTS
// -------------------
fetch(`/staff/get-subjects/?scheme=${schemeId}`)
.then(response => response.json())
.then(data => {

data.forEach(subject => {
subjectSelect.innerHTML +=
`<option value="${subject.id}">${subject.name}</option>`;
});

});

// -------------------
// LOAD SECTIONS 🔥
// -------------------
fetch(`/staff/get-sections/?scheme=${schemeId}`)
.then(response => response.json())
.then(data => {

data.forEach(section => {
sectionSelect.innerHTML +=
`<option value="${section.id}">${section.name}</option>`;
});

});

});

</script>

{% endblock %}


{% block scripts %}
<script>
    let timeout;

    function resetTimer() {
        clearTimeout(timeout);
        timeout = setTimeout(() => {
            alert("Session expired. Logging out...");
            window.location.href = "/logout/";
        }, 120000);
    }

    document.onload = resetTimer;
    document.onmousemove = resetTimer;
    document.onkeypress = resetTimer;
    document.onclick = resetTimer;
</script>
{% endblock %}
