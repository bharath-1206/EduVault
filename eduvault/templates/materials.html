<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>EduVault Materials</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <button onclick="history.back()" class="btn btn-outline-secondary mb-3">
        ← Back
    </button>

    <h2>Semester {{ semester }} Materials</h2>

    <table class="table table-bordered mt-4">

        <thead>
            <tr>
                <th>Title</th>
                <th>Download</th>
            </tr>
        </thead>

        <tbody>

            {% for material in materials %}

            <tr>
                <td>{{ material.title }}</td>
                <td>
                    <a href="{{ material.file.url }}" class="btn btn-success btn-sm" target="_blank">
                        Download
                    </a>
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
