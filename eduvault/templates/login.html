<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><!DOCTYPE html>
<html>
<head>
    <title>EduVault Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark text-light">

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow-lg p-4 bg-secondary text-light" style="width:400px">

        <h3 class="text-center mb-4">EduVault Login</h3>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Enter USN</label>
                <input type="text" name="usn" class="form-control" placeholder="1RR25XX001" required>
            </div>

            <button class="btn btn-primary w-100">
                Login
            </button>

        </form>

        {% if error %}
        <div class="alert alert-danger mt-3">
            {{ error }}
        </div>
        {% endif %}

    </div>

</div>

</body>
</html></title>
</head>
<body>

</body>
</html>
