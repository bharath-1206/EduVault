<!DOCTYPE html>
<html>

<head>

<title>EduVault Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f7fb;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.login-card{
width:420px;
}

</style>

</head>

<body>

<div class="card shadow login-card p-4">

<h3 class="text-center">
EduVault
</h3>

<p class="text-center text-muted">
<h5> Rajarajeswari College of Engineering
            (An Autonomous Institution)</h5>
</p>

<hr>

{% if messages %}
{% for message in messages %}
<div class="alert alert-danger">
{{ message }}
</div>
{% endfor %}
{% endif %}

<form method="POST" action="{% url 'login' %}">

{% csrf_token %}

<input type="text"
name="usn"
class="form-control mb-3"
placeholder="Enter USN or Staff ID"
required>

<button class="btn btn-primary w-100">
Login
</button>

</form>

</div>

</body>

</html>
