
<!DOCTYPE html>
{% load static  %}
<html>

<head>
<link rel="icon" type="image/jpeg" href="{% static 'images/logo.jpeg' %}">
<title>EduVault Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f5f7fb;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.login-card{
    width:420px;
}
</style>

</head>

<body>

<div class="card shadow login-card p-4">

<div class="d-flex align-items-center justify-content-center mb-3">

    <img src="{% static 'images/logo.jpeg' %}"
         style="width:50px; height:auto; margin-right:10px;">

    <h3 class="mb-0">EduVault</h3>

</div>

<h5 class="text-center text-muted">
Rajarajeswari College of Engineering <br>
    (An Autonomous Institution)
</h5>

<hr>

{% if messages %}
{% for message in messages %}
<div class="alert alert-danger">
{{ message }}
</div>
{% endfor %}
{% endif %}

<form method="POST" autocomplete="off">
{% csrf_token %}

<!-- 🔥 Autofill trap fields -->
<input type="text" name="fake_user" style="display:none">
<input type="password" name="fake_pass" style="display:none">

{% if ask_password %}

<!-- ✅ LOCKED STAFF ID -->
<input type="text"
name="usn"
class="form-control mb-3"
value="{{ staff_id }}"
placeholder="USN or Staff ID"
readonly
autocomplete="off">

<!-- 🔥 PASSWORD FIELD (NO NAME CHANGE) -->
<input type="password"
name="password"
class="form-control mb-3"
placeholder="Enter Password"
autocomplete="off"
autocorrect="off"
autocapitalize="off"
spellcheck="false"
readonly
onfocus="this.removeAttribute('readonly');"
required>

<!-- change ID option -->
<div class="text-center mb-2">
<a href="/">Change ID</a>
</div>

{% else %}

<!-- STEP 1 -->
<input type="text"
name="usn"
class="form-control mb-3"
placeholder="Enter USN or Staff ID"
autocomplete="off"
required>

{% endif %}

<button class="btn btn-primary w-100">
Login
</button>

</form>

</div>

</body>
</html>
