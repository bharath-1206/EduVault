{% extends "hod_base.html" %}

{% block hod_content %}

<h3>Edit Staff</h3>

<form method="POST">
{% csrf_token %}

<div class="mb-3">
<label>Name</label>
<input type="text" name="name" value="{{ staff.name }}" class="form-control" required>
</div>

<div class="mb-3">
<label>Password (leave blank to keep same)</label>
<input type="password" name="password" class="form-control">
</div>

<div class="mb-3">
<label>Role</label>
<select name="role_type" class="form-control">

<option value="branch" {% if staff.role_type == "branch" %}selected{% endif %}>
Branch Staff
</option>

<option value="cycle" {% if staff.role_type == "cycle" %}selected{% endif %}>
Cycle Staff
</option>

</select>
</div>

<button class="btn btn-success">
Update
</button>

</form>

{% endblock %}
